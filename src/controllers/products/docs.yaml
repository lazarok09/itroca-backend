openapi: 3.0.0
info:
  title: User Product API
  version: 1.0.0

paths:
  /products:
    get:
      description: Product handler to get products
      parameters:
        - in: query
          name: name
          schema:
            type: string
            description: The name of the product

      responses:
        '200':
          description: Returns a product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Prisma error containg  message status prisma error and the error catch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrismaError'
  /products/{id}:
    get:
      description: Product handler to get product
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
            description: The id of the product

      responses:
        '200':
          description: Returns a product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Prisma error containg  message status prisma error and the error catch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrismaError'

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          required:
            - 'name'
        price:
          type: integer
        image:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    GenericError:
      type: object
      properties:
        message:
          type: string
          example: Ocorreu um erro ao {action}
        status:
          type: integer
          example: 422

    PrismaError:
      type: object
      properties:
        message:
          type: string
          example: Ocorreu um erro ao {action}
        prismaMessage:
          type: string
        status:
          type: integer
          example: 400
        error:
          type: object
